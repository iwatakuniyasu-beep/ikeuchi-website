<p class="label">5-3 改A　四季がめぐる鉄（生成り）<small>桜＝焼き色の鉄板、向日葵＝金色の焼き色と打ち抜き、紅葉＝錆びた鉄板、雪＝磨いた鉄棒。すべて溶接でつないだ鉄の作品として</small></p>
